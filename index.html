<!DOCTYPE html>
<html>
<head>
    <title>Monopoly</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #667eea; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 20px; max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; }
        
        button { padding: 12px 24px; font-size: 16px; margin: 10px 5px; cursor: pointer; border: none; border-radius: 8px; background: #667eea; color: white; }
        button:hover { background: #5568d3; }
        
        #start { text-align: center; padding: 40px; }
        #playerSetup { display: none; padding: 20px; }
        #game { display: none; }
        
        .setup-container { max-width: 600px; margin: 0 auto; }
        .player-input { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .player-input input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .color-picker { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .color-option { width: 50px; height: 50px; border-radius: 4px; cursor: pointer; border: 3px solid transparent; }
        .color-option.selected { border-color: #000; }
        
        .game-layout { display: flex; gap: 20px; }
        .game-board { flex: 1; }
        .players-panel { width: 300px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 2px solid #ddd; }
        
        canvas { border: 3px solid #333; background: #2d5016; display: block; }
        #message { font-size: 16px; color: #667eea; font-weight: bold; margin-top: 15px; text-align: center; }
        
        .dice-area { display: flex; gap: 20px; justify-content: center; margin-bottom: 10px; align-items: center; }
        .dice { width: 60px; height: 60px; background: white; border: 3px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; } 
        #diceResult { font-weight: bold; font-size: 18px; color: #667eea; min-width: 150px; }
        
        .controls { text-align: center; margin-top: 8px; }
        
        .players-list { list-style: none; }
        .player-item { padding: 12px; margin-bottom: 10px; background: white; border-radius: 6px; border-left: 4px solid; display: flex; align-items: center; gap: 10px; }
        .player-item.active { background: #fffacd; font-weight: bold; }
        .player-color { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #333; }
        .player-info { flex: 1; }
        .player-name { font-weight: bold; }
        .player-money { font-size: 12px; color: #666; }        
        /* Property Card Popup */
        #propertyCard { display: none; position: absolute; background: white; border: 3px solid #333; border-radius: 8px; padding: 15px; width: 280px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 100; font-size: 12px; }
        .card-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid #ccc; }
        .card-price { margin: 5px 0; }
        .card-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
        .card-section-title { font-weight: bold; font-size: 11px; margin-bottom: 4px; }
        .rent-table { width: 100%; font-size: 10px; }
        .rent-table tr { border-bottom: 1px solid #f0f0f0; }
        .rent-table td { padding: 3px; }
        .rent-table td:first-child { font-weight: bold; width: 50%; }
        .rent-table td:last-child { text-align: right; }
        
        /* Action Modal */
        #actionModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .action-modal-content { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .action-modal-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .action-modal-subtitle { font-size: 16px; color: #666; margin-bottom: 20px; }
        .action-field-info { background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #667eea; }
        .action-field-header { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .action-field-detail { font-size: 14px; color: #666; }
        .action-buttons { display: grid; gap: 10px; margin-top: 20px; }
        .action-btn { padding: 12px 20px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .action-btn.buy { background: #28a745; color: white; }
        .action-btn.buy:hover { background: #218838; transform: translateY(-2px); }
        .action-btn.pay { background: #ff6b6b; color: white; }
        .action-btn.pay:hover { background: #e63946; transform: translateY(-2px); }
        .action-btn.build { background: #ffc107; color: #333; }
        .action-btn.build:hover { background: #ffb300; transform: translateY(-2px); }
        .action-btn.sell { background: #6c757d; color: white; }
        .action-btn.sell:hover { background: #5a6268; transform: translateY(-2px); }
        .action-btn.pass { background: #17a2b8; color: white; }
        .action-btn.pass:hover { background: #138496; transform: translateY(-2px); }
        .action-warning { background: #fff3cd; border: 1px solid #ffc107; padding: 12px; border-radius: 6px; margin-bottom: 15px; color: #856404; }
        .action-owner-info { background: #e7f3ff; padding: 12px; border-radius: 6px; margin-bottom: 15px; color: #004085; border-left: 4px solid #0056b3; }
        
        /* Log Panel */
        .log-panel { width: 300px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 2px solid #ddd; max-height: 300px; overflow-y: auto; font-size: 12px; margin-top: 15px; }
        .log-panel h4 { margin-bottom: 10px; color: #333; }
        .log-entry { padding: 8px; margin-bottom: 8px; background: white; border-left: 3px solid #667eea; border-radius: 4px; color: #666; }
        .log-entry.purchase { border-left-color: #28a745; }
        .log-entry.payment { border-left-color: #ff6b6b; }
        .log-entry.trade { border-left-color: #ffc107; }
        .log-entry.info { border-left-color: #17a2b8; }
        
        /* Player Info Popup */
        #playerInfoPopup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .player-info-content { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 12px; padding: 30px; max-width: 450px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .player-info-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .player-info-color { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #333; }
        .player-info-title { font-size: 24px; font-weight: bold; color: #333; }
        .player-info-subtitle { font-size: 14px; color: #666; }
        .player-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #f5f5f5; padding: 15px; border-radius: 8px; }
        .stat-label { font-size: 12px; color: #999; font-weight: bold; }
        .stat-value { font-size: 20px; font-weight: bold; color: #333; margin-top: 5px; }
        .properties-section { margin-top: 20px; }
        .properties-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; color: #333; }
        .properties-list { display: grid; gap: 8px; }
        .property-item { background: #f5f5f5; padding: 10px; border-radius: 6px; border-left: 4px solid #667eea; }
        .property-name { font-weight: bold; color: #333; }
        .property-detail { font-size: 11px; color: #666; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Monopoly 🎲</h1>
        
        <div id="start">
            <button onclick="showPlayerSetup()">🎮 Spiel starten</button>
        </div>

        <div id="playerSetup">
            <div class="setup-container">
                <h2>Spieler hinzufügen</h2>
                <div class="player-input">
                    <input type="text" id="playerName" placeholder="Spielername">
                    <label>Farbe wählen:</label>
                    <div class="color-picker" id="colorPicker"></div>
                    <button onclick="addPlayer()">Spieler hinzufügen</button>
                </div>
                
                <h3>Spieler im Spiel:</h3>
                <ul class="players-list" id="setupPlayersList"></ul>
                
                <button onclick="startGameWithPlayers()" style="background: #28a745; margin-top: 20px;">Spiel starten</button>
                <button onclick="goBack()" style="background: #6c757d;">Zurück</button>
            </div>
        </div>

        <div id="game">
            <div class="game-layout">
                <div class="game-board">
                    <div class="dice-area">
                        <div class="dice" id="dice1">⚁</div>
                        <div class="dice" id="dice2">⚂</div>
                        <p id="diceResult"></p>
                    </div>
                    <canvas id="board" width="800" height="800"></canvas>
                    <div id="propertyCard"></div>
                    <div id="actionModal">
                        <div class="action-modal-content" id="actionModalContent"></div>
                    </div>
                    <div id="playerInfoPopup">
                        <div class="player-info-content" id="playerInfoContent"></div>
                    </div>
                    <div id="diceContainer" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 500;">
                        <div style="display: flex; gap: 15px; justify-content: center; align-items: center; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                            <div id="diceLarge1" style="width: 80px; height: 80px; background: white; border: 3px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: bold;">⚀</div>
                            <span style="font-size: 24px; font-weight: bold; color: #333;">+</span>
                            <div id="diceLarge2" style="width: 80px; height: 80px; background: white; border: 3px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: bold;">⚀</div>
                            <span style="font-size: 24px; font-weight: bold; color: #333;">=</span>
                            <div id="diceLargeSum" style="width: 80px; height: 80px; background: #667eea; color: white; border: 3px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold;">0</div>
                        </div>
                    </div>
                    <div class="controls">
                        <button onclick="rollDice()">🎲 Würfeln</button>
                        <button onclick="openTradeMenuWithPlayers()" id="tradeButtonMain" style="display: none;">🤝 Handeln</button>
                        <button onclick="openPropertyManagementMenu()">📋 Verwalten</button>
                        <button onclick="endTurn()">➡️ Zug beenden</button>
                    </div>
                    <p id="message">Willkommen!</p>
                </div>
                <div class="players-panel">
                    <h3>Spieler</h3>
                    <ul class="players-list" id="gamePlayersList"></ul>
                    <div class="log-panel">
                        <h4>📋 Spielprotokoll</h4>
                        <div id="gameLog"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/board.js"></script>
    <script>
        // Verfügbare Farben - Klassische, deutlich unterscheidbare Farben
        const availableColors = [
            { hex: '#DC143C', name: 'Rot' },        // Crimson Red
            { hex: '#4169E1', name: 'Blau' },       // Royal Blue
            { hex: '#FFD700', name: 'Gold/Gelb' },  // Gold
            { hex: '#32CD32', name: 'Grün' },       // Lime Green
            { hex: '#FF8C00', name: 'Orange' },     // Dark Orange
            { hex: '#9370DB', name: 'Lila' }        // Medium Purple
        ];
        
        let gameActive = false;
        let players = [];
        let currentPlayer = 0;
        let selectedColor = availableColors[0];
        let gameLog = [];
        let diceRolledThisTurn = false;
        let doublesCount = 0; // Zähler für Doppelwürfe in diesem Zug
        let lastDiceSum = 0; // Letzte Würfelsumme für Utilities
        let pendingTradeOffers = {}; // { toPlayerIdx: { from: fromIdx, offer: {properties, money}, request: {properties, money} } }
        let playerJailStatus = {}; // { playerIdx: { jailedTurns: number, canEscapeThisTurn: boolean } }
        
        // Chance und Community Chest Karten
        const chanceCards = [
            { text: 'Rücke vor bis zum Schlossplatz', effect: 'moveTo', value: 39 },
            { text: 'Gehe zu Los. Ziehe 200€', effect: 'moveTo', value: 0 },
            { text: 'Gehe ins Gefängnis! Ziehe dich zurück bis Feld 10', effect: 'moveToJail', value: 10 },
            { text: 'Rücke vor bis zum nächsten Bahnhof', effect: 'moveToNextRailroad', value: null },
            { text: 'Rücke vor bis zur nächsten Straße', effect: 'moveToNextUtility', value: null },
            { text: 'Du zahlst jedem Spieler 50€', effect: 'payEachPlayer', value: 50 },
            { text: 'Dein Vermögen wird bewertet. Zahle 150€ pro Haus und 500€ pro Hotel', effect: 'payForBuildings', value: null },
            { text: 'Du ziehst ein Geschenk von der Bank: +150€', effect: 'collectMoney', value: 150 },
        ];
        
        const communityCards = [
            { text: 'Gehe zu Los. Ziehe 200€', effect: 'moveTo', value: 0 },
            { text: 'Zahle Arztkosten: 50€', effect: 'payMoney', value: 50 },
            { text: 'Zahlentag: Jeder Spieler zahlt dir 50€', effect: 'collectFromEachPlayer', value: 50 },
            { text: 'Gehe ins Gefängnis! Ziehe dich zurück bis Feld 10', effect: 'moveToJail', value: 10 },
            { text: 'Gewinne aus deinem Verkauf von Vorräten: +100€', effect: 'collectMoney', value: 100 },
            { text: 'Erbe 200€', effect: 'collectMoney', value: 200 },
            { text: 'Zinsrückzahlung: Die Bank zahlt dir 20€', effect: 'collectMoney', value: 20 },
            { text: 'Steuern sinken: Die Bank zahlt dir 100€ zurück', effect: 'collectMoney', value: 100 },
        ];
        
        let chanceDeck = [...chanceCards]; // Copy für Shuffling
        let communityDeck = [...communityCards];
        
        // Bautsystem: verfügbare Häuser und Hotels
        let availableHouses = 32;
        let availableHotels = 12;
        
        // Color mapping for board
        const colorMap = {
            'brown': '#8B4513',
            'lightblue': '#87CEEB',
            'pink': '#FF69B4',
            'orange': '#FFA500',
            'red': '#FF0000',
            'yellow': '#FFFF00',
            'green': '#00AA00',
            'darkblue': '#0000FF'
        };

        // Initialisiere Farbwähler
        function initColorPicker() {
            const picker = document.getElementById('colorPicker');
            picker.innerHTML = '';
            availableColors.forEach((color, idx) => {
                const option = document.createElement('div');
                option.className = 'color-option' + (idx === 0 ? ' selected' : '');
                option.style.backgroundColor = color.hex;
                option.onclick = () => selectColor(color, option);
                picker.appendChild(option);
            });
        }

        function selectColor(color, element) {
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedColor = color;
        }

        function showPlayerSetup() {
            players = [];
            selectedColor = availableColors[0];
            document.getElementById('start').style.display = 'none';
            document.getElementById('playerSetup').style.display = 'block';
            initColorPicker();
            updateSetupList();
        }

        function addPlayer() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim();
            
            if (!name) {
                alert('Bitte Spielernamen eingeben!');
                return;
            }
            
            if (players.some(p => p.name === name)) {
                alert('Spieler mit diesem Namen existiert bereits!');
                return;
            }

            players.push({
                name: name,
                position: 0,
                money: 1500,
                color: selectedColor.hex,
                ownedProperties: [],
                jailedTurns: 0 // 0 = nicht im Gefängnis, 1-3 = im Gefängnis für X Runden
            });

            nameInput.value = '';
            updateSetupList();
        }

        function updateSetupList() {
            const list = document.getElementById('setupPlayersList');
            list.innerHTML = '';
            players.forEach((player, idx) => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.style.borderLeftColor = player.color;
                li.innerHTML = `
                    <div class="player-color" style="background-color: ${player.color}"></div>
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                    </div>
                    <button onclick="removePlayer(${idx})" style="padding: 5px 10px; font-size: 12px; background: #dc3545;">Löschen</button>
                `;
                list.appendChild(li);
            });
        }

        function removePlayer(idx) {
            players.splice(idx, 1);
            updateSetupList();
        }

        function startGameWithPlayers() {
            if (players.length < 2) {
                alert('Mindestens 2 Spieler erforderlich!');
                return;
            }

            // Initialisiere das Board und Häuser/Hotels
            monopolyBoard.forEach(field => {
                field.owner = null;
                field.houses = 0;
                field.hotels = 0;
                field.mortgaged = false;
            });
            
            // Setze verfügbare Häuser und Hotels zurück
            availableHouses = 32;
            availableHotels = 12;

            gameActive = true;
            document.getElementById('playerSetup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            currentPlayer = 0;
            drawBoard();
            updateGameInfo();
            
            // Canvas Hover für Property Cards
            const canvas = document.getElementById('board');
            canvas.addEventListener('mousemove', handleCanvasHover);
            canvas.addEventListener('mouseleave', hidePropertyCard);
            canvas.addEventListener('click', handleCanvasClick);
        }

        function goBack() {
            document.getElementById('playerSetup').style.display = 'none';
            document.getElementById('start').style.display = 'block';
        }

        function drawBoard() {
            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');
            const size = 800;
            const fieldSize = size / 11;

            ctx.fillStyle = '#2d5016';
            ctx.fillRect(0, 0, size, size);

            // Äußerer Rahmen (die 40 Felder)
            for (let i = 0; i < 40; i++) {
                let x, y, side;

                if (i < 10) {
                    // Bottom row (unten)
                    x = size - (i + 1) * fieldSize;
                    y = size - fieldSize;
                    side = 'bottom';
                } else if (i < 20) {
                    // Left column (links)
                    x = 0;
                    y = size - (i - 9) * fieldSize;
                    side = 'left';
                } else if (i < 30) {
                    // Top row (oben)
                    x = (i - 20) * fieldSize;
                    y = 0;
                    side = 'top';
                } else {
                    // Right column (rechts)
                    x = size - fieldSize;
                    y = (i - 30) * fieldSize;
                    side = 'right';
                }

                drawField(ctx, x, y, fieldSize, monopolyBoard[i], side);
            }

            // Innenbereich
            ctx.fillStyle = '#1a3d0a';
            ctx.fillRect(fieldSize, fieldSize, size - 2 * fieldSize, size - 2 * fieldSize);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Monopoly', size / 2, size / 2);

            // Spieler zeichnen
            drawPlayers(ctx, fieldSize, size);
        }

        function drawField(ctx, x, y, size, field, side) {
            // Bestimme Farbe basierend auf Typ
            let fieldColor = '#FFFFFF'; // Default
            
            if (field.type === 'corner') {
                fieldColor = '#FFFFFF';
            } else if (field.type === 'property') {
                fieldColor = colorMap[field.color] || '#FFFFFF';
            } else if (field.type === 'railroad') {
                fieldColor = '#808080';
            } else if (field.type === 'utility') {
                fieldColor = '#FFD700';
            } else if (field.type === 'community') {
                fieldColor = '#FFD700';
            } else if (field.type === 'chance') {
                fieldColor = '#FF8C00';
            } else if (field.type === 'tax') {
                fieldColor = '#FFFFFF';
            }

            // Hintergrund
            ctx.fillStyle = fieldColor;
            ctx.fillRect(x, y, size, size);

            // Rahmen
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, size, size);

            // Text
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const lines = field.name.split('\n');
            const lineHeight = 11;
            const totalHeight = (lines.length - 1) * lineHeight;

            // Unterschiedliche Ausrichtung pro Seite
            if (side === 'bottom') {
                // Unten - Text zeigt nach oben (normal)
                lines.forEach((line, i) => {
                    ctx.fillText(line, x + size / 2, y + size / 2 - totalHeight / 2 + i * lineHeight);
                });
                if (field.price && field.price > 0) {
                    ctx.font = '8px Arial';
                    ctx.fillText(field.price + '€', x + size / 2, y + size / 2 + totalHeight / 2 + 10);
                }
            } else if (side === 'top') {
                // Oben - Text zeigt nach unten (normal)
                lines.forEach((line, i) => {
                    ctx.fillText(line, x + size / 2, y + size / 2 - totalHeight / 2 + i * lineHeight);
                });
                if (field.price && field.price > 0) {
                    ctx.font = '8px Arial';
                    ctx.fillText(field.price + '€', x + size / 2, y + size / 2 + totalHeight / 2 + 10);
                }
            } else if (side === 'left') {
                // Links - Text zeigt nach rechts (90° CW)
                ctx.save();
                ctx.translate(x + size / 2, y + size / 2);
                ctx.rotate(Math.PI / 2);
                
                lines.forEach((line, i) => {
                    ctx.fillText(line, 0, -totalHeight / 2 + i * lineHeight);
                });
                
                if (field.price && field.price > 0) {
                    ctx.font = '8px Arial';
                    ctx.fillText(field.price + '€', 0, totalHeight / 2 + 10);
                }
                
                ctx.restore();
            } else if (side === 'right') {
                // Rechts - Text zeigt nach links (-90° CCW)
                ctx.save();
                ctx.translate(x + size / 2, y + size / 2);
                ctx.rotate(-Math.PI / 2);
                
                lines.forEach((line, i) => {
                    ctx.fillText(line, 0, -totalHeight / 2 + i * lineHeight);
                });
                
                if (field.price && field.price > 0) {
                    ctx.font = '8px Arial';
                    ctx.fillText(field.price + '€', 0, totalHeight / 2 + 10);
                }
                
                ctx.restore();
            }
            
            // Zeichne Häuser/Hotels Indikatoren für Grundstücke
            if (field.type === 'property' && (field.houses > 0 || field.hotels > 0)) {
                ctx.fillStyle = field.hotels > 0 ? '#FF0000' : '#00AA00';
                const indicatorSize = 8;
                const padding = 3;
                
                if (side === 'bottom' || side === 'top') {
                    // Horizontal arrangement
                    const startX = x + size / 2 - (field.houses > 0 ? field.houses : 1) * (indicatorSize + padding) / 2;
                    for (let i = 0; i < (field.hotels > 0 ? 1 : field.houses); i++) {
                        ctx.fillRect(startX + i * (indicatorSize + padding), y + size - indicatorSize - padding, indicatorSize, indicatorSize);
                    }
                } else if (side === 'left' || side === 'right') {
                    // Vertical arrangement
                    const startY = y + size / 2 - (field.houses > 0 ? field.houses : 1) * (indicatorSize + padding) / 2;
                    for (let i = 0; i < (field.hotels > 0 ? 1 : field.houses); i++) {
                        ctx.fillRect(x + padding, startY + i * (indicatorSize + padding), indicatorSize, indicatorSize);
                    }
                }
            }
        }

        function drawPlayers(ctx, fieldSize, size) {
            for (let i = 0; i < players.length; i++) {
                const field = players[i].position % 40;
                let posX, posY;

                if (field < 10) {
                    posX = size - (field + 1) * fieldSize + fieldSize / 2;
                    posY = size - fieldSize / 4;
                } else if (field < 20) {
                    posX = fieldSize / 4;
                    posY = size - (field - 9) * fieldSize + fieldSize / 2;
                } else if (field < 30) {
                    posX = (field - 20) * fieldSize + fieldSize / 2;
                    posY = fieldSize / 4;
                } else {
                    posX = size - fieldSize / 4;
                    posY = (field - 30) * fieldSize + fieldSize / 2;
                }

                ctx.fillStyle = players[i].color;
                ctx.beginPath();
                ctx.arc(posX, posY, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function rollDice() {
            const player = players[currentPlayer];
            
            // Prüfe ob Spieler im Gefängnis ist
            if (player.jailedTurns > 0) {
                alert(`Du bist noch ${player.jailedTurns} Runde(n) im Gefängnis! Du kannst dich befreien oder warten.`);
                return;
            }
            
            if (diceRolledThisTurn) {
                alert('Du hast bereits gewürfelt! Beende deinen Zug mit "Zug beenden"');
                return;
            }
            
            const die1 = Math.floor(Math.random() * 6) + 1;
            const die2 = Math.floor(Math.random() * 6) + 1;
            const total = die1 + die2;
            const isDoubles = die1 === die2;
            
            // Speichere Würfelsumme für Utility-Miete
            lastDiceSum = total;
            
            // Würfel in Mittelpunkt anzeigen
            const diceContainer = document.getElementById('diceContainer');
            document.getElementById('diceLarge1').textContent = getDiceFace(die1);
            document.getElementById('diceLarge2').textContent = getDiceFace(die2);
            document.getElementById('diceLargeSum').textContent = total + (isDoubles ? ' 🎲 DOUBLES!' : '');
            diceContainer.style.display = 'block';
            
            // Auch in der kleinen Anzeige
            document.getElementById('dice1').textContent = getDiceFace(die1);
            document.getElementById('dice2').textContent = getDiceFace(die2);
            document.getElementById('diceResult').textContent = `Summe: ${total}` + (isDoubles ? ' (DOUBLES!)' : '');
            
            // Nur bei NICHT-Doubles wird die Würflung blockiert
            if (!isDoubles) {
                diceRolledThisTurn = true;
            }
            
            document.querySelector('button[onclick="rollDice()"]').disabled = !isDoubles; // Disables wenn NICHT Doubles
            document.getElementById('tradeButtonMain').style.display = 'inline-block';
            
            // Prüfe Doubles und zähle
            if (isDoubles) {
                doublesCount++;
                
                // Nach 3 Doubles → Gefängnis!
                if (doublesCount >= 3) {
                    addLog(`${players[currentPlayer].name} hat 3x Doubles geworfen → GEFÄNGNIS!`, 'info');
                    player.position = 10;
                    player.jailedTurns = 3;
                    doublesCount = 0; // Zurücksetzen
                    diceRolledThisTurn = true; // Jetzt ist die Runde vorbei
                    drawBoard();
                    alert('3 Doubles hintereinander! Du gehst ins Gefängnis!');
                    endTurn();
                    return;
                }
                addLog(`${players[currentPlayer].name} würfelt Doubles (${die1}+${die2}=${total}) - nochmal würfeln!`, 'info');
            } else {
                doublesCount = 0; // Zurücksetzen wenn kein Double
                addLog(`${players[currentPlayer].name} würfelt: ${die1} + ${die2} = ${total}`, 'info');
            }
            
            // Spieler animiert bewegen
            animatePlayerMovement(currentPlayer, total, isDoubles);
        }

        function getDiceFace(num) {
            const faces = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            return faces[num];
        }

        function animatePlayerMovement(playerIndex, steps, isDoubles) {
            const canvas = document.getElementById('board');
            const fieldSize = canvas.width / 11;
            const player = players[playerIndex];
            const startPos = player.position;
            let endPos = (startPos + steps) % 40;
            let currentStep = 0;
            const animationSpeed = 150; // ms pro Feld (kleiner = schneller)
            let passedGO = false;

            function animate() {
                if (currentStep <= steps) {
                    player.position = (startPos + currentStep) % 40;
                    drawBoard();
                    currentStep++;
                    setTimeout(animate, animationSpeed);
                } else {
                    player.position = endPos;
                    
                    // Prüfe ob über los gegangen wurde (position wraps around)
                    if (startPos + steps >= 40) {
                        passedGO = true;
                        player.money += 200;
                        addLog(`${player.name} geht über Los und erhält 200€!`, 'payment');
                    }
                    
                    // Prüfe ob auf "Gehe ins Gefängnis" gelandet (Feld 30)
                    if (endPos === 30) {
                        player.position = 10; // Teleportiere zu Gefängnis
                        player.jailedTurns = 3; // 3 Runden im Gefängnis
                        endPos = 10;
                        passedGO = false; // Kein Los Bonus wenn ins Gefängnis
                        addLog(`${player.name} geht ins Gefängnis!`, 'info');
                    }
                    
                    drawBoard();
                    // Öffne Action Modal nach Zug
                    showActionModal(playerIndex, endPos);
                }
            }
            animate();
        }

        function endTurn() {
            // Reduziere Gefängnis-Runden für aktuellen Spieler
            if (players[currentPlayer].jailedTurns > 0) {
                players[currentPlayer].jailedTurns--;
                if (players[currentPlayer].jailedTurns === 0) {
                    addLog(`${players[currentPlayer].name} ist aus dem Gefängnis entlassen!`, 'info');
                }
            }
            
            // Setze Doubles-Zähler zurück für nächsten Spieler
            doublesCount = 0;
            
            currentPlayer = (currentPlayer + 1) % players.length;
            document.getElementById('dice1').textContent = '⚀';
            document.getElementById('dice2').textContent = '⚀';
            document.getElementById('diceResult').textContent = '';
            document.getElementById('diceContainer').style.display = 'none';
            diceRolledThisTurn = false;
            document.querySelector('button[onclick="rollDice()"]').disabled = false;
            document.getElementById('tradeButtonMain').style.display = 'none';
            addLog(`${players[currentPlayer].name} ist jetzt am Zug!`, 'info');
            updateGameInfo(players[currentPlayer].name + ' ist jetzt am Zug!');
        }

        function handleCanvasHover(e) {
            const canvas = document.getElementById('board');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const fieldIndex = getFieldAtPosition(x, y);
            
            if (fieldIndex !== -1 && (monopolyBoard[fieldIndex].type === 'property' || monopolyBoard[fieldIndex].type === 'railroad' || monopolyBoard[fieldIndex].type === 'utility')) {
                showPropertyCard(fieldIndex, e.clientX, e.clientY);
            } else {
                hidePropertyCard();
            }
        }

        function getFieldAtPosition(x, y) {
            const size = 800;
            const fieldSize = size / 11;
            
            // Bottom row (0-9)
            if (y >= size - fieldSize && y < size) {
                for (let i = 0; i < 10; i++) {
                    const fieldX = size - (i + 1) * fieldSize;
                    if (x >= fieldX && x < fieldX + fieldSize) return i;
                }
            }
            
            // Left column (10-19)
            if (x >= 0 && x < fieldSize) {
                for (let i = 10; i < 20; i++) {
                    const fieldY = size - (i - 9) * fieldSize;
                    if (y >= fieldY && y < fieldY + fieldSize) return i;
                }
            }
            
            // Top row (20-29)
            if (y >= 0 && y < fieldSize) {
                for (let i = 20; i < 30; i++) {
                    const fieldX = (i - 20) * fieldSize;
                    if (x >= fieldX && x < fieldX + fieldSize) return i;
                }
            }
            
            // Right column (30-39)
            if (x >= size - fieldSize && x < size) {
                for (let i = 30; i < 40; i++) {
                    const fieldY = (i - 30) * fieldSize;
                    if (y >= fieldY && y < fieldY + fieldSize) return i;
                }
            }
            
            return -1;
        }

        // ==================== SPIELMECHANIK ====================
        
        function showActionModal(playerIndex, fieldIndex) {
            const player = players[playerIndex];
            // FIX: Stelle sicher dass fieldIndex mit aktueller Position synchronisiert ist
            const actualFieldIndex = players[playerIndex].position % 40;
            fieldIndex = actualFieldIndex;
            const field = monopolyBoard[fieldIndex];
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('actionModalContent');
            
            let html = `
                <div class="action-modal-title">${player.name}'s Zug</div>
                <div class="action-modal-subtitle">Feld: ${field.name}</div>
                <div class="action-field-info">
                    <div class="action-field-header">${field.name}</div>
                    <div class="action-field-detail">Feldtyp: ${getFieldTypeName(field.type)}</div>
            `;
            
            if (field.type === 'property' || field.type === 'railroad' || field.type === 'utility') {
                const owner = getFieldOwner(fieldIndex);
                if (owner === null) {
                    // Nicht gekauft
                    html += `<div class="action-field-detail" style="margin-top: 10px; font-weight: bold; color: #28a745;">Kaufbar - ${field.price}€</div>`;
                } else if (owner === playerIndex) {
                    // Eigentum des Spielers
                    html += `<div class="action-field-detail" style="margin-top: 10px; font-weight: bold; color: #007bff;">Dein Eigentum</div>`;
                } else {
                    // Gehört jemand anderem
                    html += `<div class="action-field-detail" style="margin-top: 10px; font-weight: bold; color: #ff6b6b;">Gehört ${players[owner].name}</div>`;
                }
            }
            
            html += `</div>`;
            
            // Spezialfall: Gefängnis
            if (fieldIndex === 10 && player.jailedTurns > 0) {
                html += getJailActions(playerIndex);
            } else if (field.type === 'corner') {
                html += getCornerFieldActions(fieldIndex);
            } else if (field.type === 'property' || field.type === 'railroad' || field.type === 'utility') {
                html += getPropertyActions(playerIndex, fieldIndex);
            } else if (field.type === 'tax') {
                html += getTaxActions(playerIndex, fieldIndex);
            } else if (field.type === 'chance' || field.type === 'community') {
                html += getChanceActions(playerIndex, fieldIndex);
            } else {
                html += `<div class="action-buttons">
                    <button class="action-btn pass" onclick="closeActionModal()">Weiter</button>
                </div>`;
            }
            
            content.innerHTML = html;
            modal.style.display = 'block';
        }
        
        function getFieldTypeName(type) {
            const names = {
                'property': 'Straße',
                'railroad': 'Bahnhof',
                'utility': 'Werk',
                'corner': 'Spezialfeld',
                'tax': 'Steuer',
                'chance': 'Ereignis',
                'community': 'Gemeinschaftsfeld'
            };
            return names[type] || type;
        }
        
        function getFieldOwner(fieldIndex) {
            const field = monopolyBoard[fieldIndex];
            // Prüfe zuerst field.owner (neue Methode)
            if (field.owner !== null && field.owner !== undefined) {
                return field.owner;
            }
            // Fallback: suche in players ownedProperties (alte Methode)
            for (let i = 0; i < players.length; i++) {
                if (players[i].ownedProperties.includes(fieldIndex)) {
                    return i;
                }
            }
            return null;
        }
        
        function getJailActions(playerIndex) {
            const player = players[playerIndex];
            let html = `
                <div class="action-warning" style="background: #ffcccc; color: #cc0000;">
                    🔒 DU BIST IM GEFÄNGNIS!
                </div>
                <div style="background: #fff3cd; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #ff9800;">
                    <div style="font-weight: bold; margin-bottom: 10px; color: #856404;">Gefängnis Status:</div>
                    <div style="font-size: 14px; color: #856404;">Noch ${player.jailedTurns} Runde(n) im Gefängnis</div>
                    <div style="font-size: 12px; color: #856404; margin-top: 8px;">Du kannst still handeln und Miete kassieren!</div>
                </div>
                <div class="action-buttons">

                        💰 Befreiung kaufen (50€)
                    </button>
                    <button class="action-btn pass" onclick="closeActionModal()">
                        👉 Zug beenden (${player.jailedTurns} Runde(n) warten)
                    </button>
                </div>
            `;
            return html;
        }
        
        function escapeJail(playerIndex) {
            const player = players[playerIndex];
            
            if (player.money < 50) {
                alert('Du hast nicht genug Geld! (benötigt 50€)');
                return;
            }
            
            player.money -= 50;
            player.jailedTurns = 0;
            addLog(`${player.name} zahlt 50€ und entkommt aus dem Gefängnis!`, 'payment');
            closeActionModal();
        }
        
        function getCornerFieldActions(fieldIndex) {
            const field = monopolyBoard[fieldIndex];
            let html = `<div class="action-warning">${field.name}</div>`;
            html += `<div class="action-buttons">
                <button class="action-btn pass" onclick="closeActionModal()">Weiter</button>
            </div>`;
            return html;
        }
        
        function getPropertyActions(playerIndex, fieldIndex) {
            const field = monopolyBoard[fieldIndex];
            const owner = getFieldOwner(fieldIndex);
            const player = players[playerIndex];
            let html = `<div class="action-buttons">`;
            
            if (owner === null) {
                // Feld ist zu verkaufen/Auktion verfügbar
                if (player.money >= field.price) {
                    html += `<button class="action-btn buy" onclick="buyProperty(${playerIndex}, ${fieldIndex})">
                        🏠 Kaufen (${field.price}€)
                    </button>`;
                } else {
                    html += `<div class="action-warning">❌ Zu wenig Geld zum Kaufen (du hast ${player.money}€, brauchst ${field.price}€)</div>`;

                // Option: Nicht kaufen → Auktion
                html += `<button class="action-btn pass" onclick="startAuction(${fieldIndex})">
                    🔨 Nicht kaufen → Auktion
                </button>`;
            } else if (owner === playerIndex) {
                // Eigentum des Spielers
                if (field.mortgaged) {
                    html += `<div class="action-warning" style="background: #ffcccc; color: #cc0000;">🔒 Diese Property ist hypothekenbelastet!</div>`;

                </button>`;

                </button>`;
                html += `<button class="action-btn pass" onclick="closeActionModal()">Schließen</button>`;
            } else {
                // Gehört jemand anderem - Miete zahlen
                const rentAmount = calculateRent(fieldIndex, owner);
                
                // Zeige an, wenn mortgaged
                if (field.mortgaged) {
                    html += `<div class="action-warning" style="background: #fff3cd; color: #856404;">🔒 Diese Property ist hypothekenbelastet - keine Miete fällig!</div>`;
                } else if (rentAmount === 0) {
                    html += `<div class="action-owner-info">📍 Diese Property gehört ${players[owner].name}</div>`;
                } else {
                    html += `<div class="action-owner-info">💳 Miete an ${players[owner].name}: <strong>${rentAmount}€</strong></div>`;

                        </button>`;

                html += `<button class="action-btn build" onclick="openTradeBuilder(${playerIndex}, ${owner})">
                    🤝 Mit ${players[owner].name} handeln
                </button>`;
                html += `<button class="action-btn pass" onclick="closeActionModal()">Schließen</button>`;
            }
            
            html += `</div>`;
            return html;
        }
        
        function startAuction(fieldIndex) {
            const field = monopolyBoard[fieldIndex];
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('actionModalContent');
            
            // Starte mit Startpreis = Hälfte des Kaufpreises
            const startPrice = Math.ceil(field.price / 2);
            
            let html = `
                <div class="action-modal-title">🔨 Auktion: ${field.name}</div>
                <div class="action-field-info">
                    <div class="action-field-header">Startgebot: ${startPrice}€</div>
                    <div class="action-field-detail">Kaufpreis: ${field.price}€</div>
            `;
            
            // Sammle alle Spieler die Geld genug haben
            const bidders = players
                .filter((p, idx) => p.money >= startPrice)
                .map((p, idx) => ({ name: p.name, money: p.money, index: players.indexOf(p) }));
            
            if (bidders.length === 0) {
                html += `<div class="action-warning">Kein Spieler kann bieten - Property bleibt unverkauft!</div>`;
                html += `</div><div class="action-buttons">
                    <button class="action-btn pass" onclick="closeActionModal()">OK</button>
                </div>`;
                content.innerHTML = html;
                modal.style.display = 'block';
                return;
            }
            
            html += `<div class="action-field-detail" style="margin-top: 10px;">
                <strong>Aktuelle Bieter:</strong><ul>`;
            
            bidders.forEach(b => {
                html += `<li>${b.name} (${b.money}€)</li>`;
            });
            
            html += `</ul></div></div>`;
            html += `<div class="action-buttons">
                <input type="number" id="auctionBid" min="${startPrice}" value="${startPrice}" placeholder="Gebot (€)" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <button class="action-btn build" onclick="processAuctionBid(${fieldIndex}, parseInt(document.getElementById('auctionBid').value))">
                    🔨 Gebot abgeben
                </button>
                <button class="action-btn pass" onclick="closeActionModal()">Auktion beenden</button>
            </div>`;
            
            content.innerHTML = html;
            modal.style.display = 'block';
        }
        
        let auctionState = { fieldIndex: null, currentBid: 0, currentBidder: null, highestBidder: null, passCount: 0 };
        
        function processAuctionBid(fieldIndex, bidAmount) {
            const field = monopolyBoard[fieldIndex];
            const minBid = auctionState.currentBid > 0 ? auctionState.currentBid + 10 : Math.ceil(field.price / 2);
            
            if (bidAmount < minBid) {
                alert(`Gebot zu niedrig! Mindestgebot: ${minBid}€`);
                return;
            }
            
            // Einfache Auktion: Automatisch zum höchsten Gebot
            let highestBid = bidAmount;
            let highestBidder = currentPlayer;
            
            // Andere Spieler können auch bieten (vereinifacht: nur der aktuelle Spieler kann bieten)
            auctionState.currentBid = bidAmount;

        function drawCard(playerIndex, cardType) {
            const player = players[playerIndex];
            let card, deck;
            
            if (cardType === 'chance') {
                deck = chanceDeck;
            } else {
                deck = communityDeck;
            }
            
            // Shuffle wenn Deck leer (Karten-Zyklus)
            if (deck.length === 0) {
                if (cardType === 'chance') {
                    chanceDeck = [...chanceCards];
                    deck = chanceDeck;
                } else {
                    communityDeck = [...communityCards];
                    deck = communityDeck;
                }
            }
            
            // Random card from deck
            const cardIndex = Math.floor(Math.random() * deck.length);
            const card_obj = deck[cardIndex];
            deck.splice(cardIndex, 1); // Karte entfernen
            
            // Zeige Modal mit Karte
            const modal = document.getElementById('actionModal');

                    <div style="font-size: 16px; line-height: 1.6;">${card_obj.text}</div>
                </div>
                <div class="action-buttons">
            `;
            
            // Führe Kartenwirkung aus
            executeCardEffect(playerIndex, card_obj);

                    <button class="action-btn pass" onclick="closeActionModal()">Zug beenden</button>
                </div>
            `;

            addLog(`${player.name} zog eine ${cardType === 'chance' ? 'Ereignis' : 'Gemeinschafts'}-Karte: ${card_obj.text}`, 'info');
        }
        
        function executeCardEffect(playerIndex, card) {
            const player = players[playerIndex];
            
            switch (card.effect) {
                case 'moveTo':
                    // Ziehe Spieler zu Feld
                    const oldPos = player.position;
                    player.position = card.value;
                    
                    // Wenn über Los gegangen
                    if (oldPos > player.position) {
                        player.money += 200;
                        addLog(`${player.name} passierte Los und erhielt 200€!`, 'payment');
                    }
                    
                    drawBoard();
                    break;
                    
                case 'moveToJail':
                    player.position = 10;
                    player.jailedTurns = 3;
                    addLog(`${player.name} geht ins Gefängnis!`, 'info');
                    drawBoard();
                    break;
                    
                case 'moveToNextRailroad':
                    const railroads = [5, 15, 25, 35];
                    const nextRailroad = railroads.find(r => r > player.position) || railroads[0];
                    if (nextRailroad < player.position) {
                        player.money += 200; // Los Bonus
                        addLog(`${player.name} passierte Los und erhielt 200€!`, 'payment');
                    }
                    player.position = nextRailroad;
                    addLog(`${player.name} rückt zum nächsten Bahnhof vor (Feld ${nextRailroad})`, 'info');
                    drawBoard();
                    break;
                    
                case 'moveToNextUtility':
                    const utilities = [12, 28];
                    const nextUtility = utilities.find(u => u > player.position) || utilities[0];
                    if (nextUtility < player.position) {
                        player.money += 200; // Los Bonus
                        addLog(`${player.name} passierte Los und erhielt 200€!`, 'payment');
                    }
                    player.position = nextUtility;
                    addLog(`${player.name} rückt zum nächsten Werk vor (Feld ${nextUtility})`, 'info');
                    drawBoard();
                    break;
                    
                case 'payEachPlayer':
                    for (let i = 0; i < players.length; i++) {
                        if (i !== playerIndex && players[i].money >= 0) {
                            player.money -= card.value;
                            players[i].money += card.value;
                        }
                    }
                    addLog(`${player.name} zahlte jedem Spieler ${card.value}€`, 'payment');
                    checkBankruptcy(playerIndex);
                    break;
                    
                case 'collectFromEachPlayer':
                    for (let i = 0; i < players.length; i++) {
                        if (i !== playerIndex) {
                            players[i].money -= card.value;
                            player.money += card.value;
                            checkBankruptcy(i);
                        }
                    }
                    addLog(`Jeder Spieler zahlt ${player.name} ${card.value}€`, 'payment');
                    break;
                    
                case 'payMoney':
                    player.money -= card.value;
                    addLog(`${player.name} zahlt ${card.value}€`, 'payment');
                    checkBankruptcy(playerIndex);
                    break;
                    
                case 'collectMoney':
                    player.money += card.value;
                    addLog(`${player.name} erhält ${card.value}€`, 'payment');
                    break;
                    
                case 'payForBuildings':
                    let buildingCost = 0;
                    for (let propIdx of player.ownedProperties) {
                        const field = monopolyBoard[propIdx];
                        buildingCost += field.houses * 150 + field.hotels * 500;
                    }
                    player.money -= buildingCost;
                    addLog(`${player.name} zahlt ${buildingCost}€ für Häuser und Hotels`, 'payment');
                    checkBankruptcy(playerIndex);
                    break;
            }
        }
        
        function calculateRent(fieldIndex, ownerIndex) {
            const field = monopolyBoard[fieldIndex];
            const owner = players[ownerIndex];
            
            // Wenn die Property hypothekenbelastet ist: keine Miete!
            if (field.mortgaged) {
                return 0;
            }
            
            if (field.type === 'property') {
                // Wenn Hotels vorhanden: hotel rent
                if (field.hotels > 0) {
                    return field.rent[5]; // Hotel rent (6. Index in rent array)
                }
                // Wenn Häuser vorhanden: house rent
                if (field.houses > 0) {
                    return field.rent[field.houses]; // rent[1] bis rent[4] für 1-4 Häuser
                }
                // Keine Häuser/Hotels: Basis-Mietpreis
                return field.rent[0];
            } else if (field.type === 'railroad') {
                // Bahnhöfe: Miete hängt von Anzahl ab
                // 1 = 25€, 2 = 50€, 3 = 100€, 4 = 200€
                const railroadIndices = [5, 15, 25, 35]; // Alle Bahnhöfe
                let railroadsOwned = 0;
                
                for (let railIdx of railroadIndices) {
                    if (monopolyBoard[railIdx].owner === ownerIndex) {
                        railroadsOwned++;
                    }
                }
                
                // Miete = 25 * 2^(n-1) eurem ist n Anzahl
                return 25 * Math.pow(2, railroadsOwned - 1);
            } else if (field.type === 'utility') {
                // Werke: Miete hängt von Anzahl und Würfelsumme ab
                // 1 Werk: Würfelsumme x 4€
                // 2 Werke: Würfelsumme x 10€
                const utilityIndices = [12, 28]; // Alle Werke
                let utilitiesOwned = 0;
                
                for (let utilIdx of utilityIndices) {
                    if (monopolyBoard[utilIdx].owner === ownerIndex) {
                        utilitiesOwned++;
                    }
                }
                
                // Bei 1 Werk: x4, bei 2 Werke: x10
                const multiplier = (utilitiesOwned === 1) ? 4 : 10;
                return lastDiceSum * multiplier;
            }
            
            return 0;
        }
        
        function buyProperty(playerIndex, fieldIndex) {

            const field = monopolyBoard[fieldIndex];
            
            player.money -= field.price;
            player.ownedProperties.push(fieldIndex);
            field.owner = playerIndex; // Speichere owner auf dem Field
            
            let logMessage = `${player.name} kauft ${field.name} für ${field.price}€`;

            addLog(logMessage, 'purchase');
            
            // Wenn die Property mortgaged ist, frage ob auflösen

                if (shouldUnmortgage && player.money >= unmortgageCost) {
                    player.money -= unmortgageCost;
                    field.mortgaged = false;
                    addLog(`${player.name} löst Hypothek auf ${field.name} sofort auf (-${unmortgageCost}€)`, 'info');
                    updateGameInfo(`${player.name} kaufte ${field.name} und löste die Hypothek auf!`);
                    checkBankruptcy(playerIndex);
                } else if (shouldUnmortgage) {
                    addLog(`${player.name} wollte Hypothek auflösen, aber hat nicht genug Geld!`, 'info');

                updateGameInfo(`${player.name} hat ${field.name} für ${field.price}€ gekauft!`);

            closeActionModal();
        }

                addLog(`${player.name} ist BANKROTT und wurde aus dem Spiel entfernt!`, 'info');

                // Alle Eigenschaften des Spielers verkaufen
                for (let i = 0; i < monopolyBoard.length; i++) {
                    if (monopolyBoard[i].owner === playerIndex) {
                        // Hypotheken-Status zurücksetzen
                        monopolyBoard[i].mortgaged = false;

                        availableHouses += monopolyBoard[i].houses;
                        availableHotels += monopolyBoard[i].hotels;
                        monopolyBoard[i].houses = 0;
                        monopolyBoard[i].hotels = 0;
                        // Besitz entfernen
                        monopolyBoard[i].owner = null;
                    }
                }
                
                // Spieler aus dem Spiel entfernen
                players.splice(playerIndex, 1);
                
                // Spielerindex anpassen wenn nötig
                if (currentPlayer >= players.length) {
                    currentPlayer = 0;

                if (players.length === 1) {
                    alert(`🎉 ${players[0].name} hat gewonnen!`);

                    return;
                }
                
                // Nächster Spieler
                if (currentPlayer >= players.length) {
                    currentPlayer = 0;
                }
                
                drawBoard();
                endTurn();
            }

            const propertiesInGroup = monopolyBoard.filter(f => f.color === colorGroup && f.type === 'property');

            const minHouses = Math.min(...houseCounts);
            
            // Wenn dieses Feld mit dem neuen Haus die max+2 hätte, ist zu unausgewogen
            if (field.houses === maxHouses && (maxHouses - minHouses >= 1)) {
                alert(`⚠️ Hausverteilung nicht erlaubt! Max. 1 Haus Unterschied in der gleichen Farbe.\n\nAktuell: min=${minHouses}, max=${maxHouses}\nNach deinem Bau: max=${maxHouses + 1}`);

            player.money -= houseCost;
            field.houses += 1;
            availableHouses -= 1;

        function mortgageProperty(playerIndex, fieldIndex) {
            const field = monopolyBoard[fieldIndex];
            const player = players[playerIndex];
            const mortgageValue = field.price / 2;
            
            player.money += mortgageValue;
            field.mortgaged = true; // Markiere als hypothekenbelastet
            const propIdx = player.ownedProperties.indexOf(fieldIndex);
            if (propIdx > -1) {
                player.ownedProperties.splice(propIdx, 1);
            }
            
            addLog(`${player.name} nimmt Hypothek auf ${field.name} auf (+${mortgageValue}€)`, 'info');
            updateGameInfo(`${player.name} nahm eine Hypothek auf ${field.name} auf (+${mortgageValue}€)`);
            closeActionModal();
        }
        
        function unmortgageProperty(playerIndex, fieldIndex) {
            const field = monopolyBoard[fieldIndex];
            const player = players[playerIndex];
            const unmortgageCost = Math.ceil(field.price / 2 * 1.1); // 10% Zinsen
            
            if (player.money < unmortgageCost) {
                alert(`Nicht genug Geld! (benötigt: ${unmortgageCost}€, hast: ${player.money}€)`);
                return;
            }
            
            player.money -= unmortgageCost;
            field.mortgaged = false;
            player.ownedProperties.push(fieldIndex); // Füge zu Besitztümern hinzu
            
            addLog(`${player.name} löst Hypothek auf ${field.name} auf (-${unmortgageCost}€, inkl. Zinsen)`, 'info');
            updateGameInfo(`${player.name} löste Hypothek auf ${field.name} auf!`);
            closeActionModal();
            
            // Bankrott-Prüfung
            checkBankruptcy(playerIndex);
        }

        // ==================== SPIELER-KLICK ====================
        
        function handleCanvasClick(e) {
            const canvas = document.getElementById('board');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const playerIdx = getPlayerAtPosition(x, y);
            if (playerIdx !== -1) {
                showPlayerInfo(playerIdx);
            }
        }
        
        function getPlayerAtPosition(x, y) {
            const canvas = document.getElementById('board');
            const fieldSize = canvas.width / 11;
            
            for (let i = 0; i < players.length; i++) {
                const field = players[i].position % 40;
                let posX, posY;

                if (field < 10) {
                    posX = canvas.width - (field + 1) * fieldSize + fieldSize / 2;
                    posY = canvas.height - fieldSize / 4;
                } else if (field < 20) {
                    posX = fieldSize / 4;
                    posY = canvas.height - (field - 9) * fieldSize + fieldSize / 2;
                } else if (field < 30) {
                    posX = (field - 19) * fieldSize + fieldSize / 2;
                    posY = fieldSize / 4;
                } else {
                    posX = canvas.width - fieldSize / 4;
                    posY = (field - 29) * fieldSize + fieldSize / 2;
                }
                
                const distance = Math.sqrt((x - posX) ** 2 + (y - posY) ** 2);
                if (distance < 20) return i;
            }
            return -1;
        }

                alert('Wähle mindestens eine Immobilie oder einen Gelbetrag!');

                }
                if (offer.request.money > 0) {
                    html += `<div style="padding: 8px; background: #fff9e6; margin: 5px 0; border-radius: 3px; border: 1px solid #ffc107;">💰 ${offer.request.money}€</div>`;
                }
            }
            
            html += `
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn buy" onclick="acceptTradeOffer(${toIdx})">
                        ✅ Akzeptieren
                    </button>
                    <button class="action-btn sell" onclick="rejectTradeOffer(${toIdx})">
                        ❌ Ablehnen
                    </button>
                </div>
            `;
            
            content.innerHTML = html;
            modal.style.display = 'block';
        }
        
        function acceptTradeOffer(toIdx) {
            const offer = pendingTradeOffers[toIdx];
            const fromPlayer = players[offer.from];
            const toPlayer = players[toIdx];
            
            // Führe den Handel aus - Immobilien
            offer.offer.properties.forEach(propIdx => {
                const idx = fromPlayer.ownedProperties.indexOf(propIdx);
                if (idx > -1) {
                    fromPlayer.ownedProperties.splice(idx, 1);
                    toPlayer.ownedProperties.push(propIdx);
                }
            });
            
            offer.request.properties.forEach(propIdx => {
                const idx = toPlayer.ownedProperties.indexOf(propIdx);
                if (idx > -1) {
                    toPlayer.ownedProperties.splice(idx, 1);
                    fromPlayer.ownedProperties.push(propIdx);
                }
            });
            
            // Führe den Handel aus - Geld
            fromPlayer.money -= offer.offer.money;
            toPlayer.money += offer.offer.money;
            
            toPlayer.money -= offer.request.money;
            fromPlayer.money += offer.request.money;
            
            let tradeDesc = `${fromPlayer.name} und ${toPlayer.name} einigen sich auf einen Handel`;
            if (offer.offer.properties.length > 0 || offer.offer.money > 0 || 
                offer.request.properties.length > 0 || offer.request.money > 0) {
                tradeDesc += ` (${offer.offer.properties.length} Immobilien + ${offer.offer.money}€ ↔ ${offer.request.properties.length} Immobilien + ${offer.request.money}€)`;
            }
            
            addLog(tradeDesc, 'trade');
            delete pendingTradeOffers[toIdx];
            
            updateGamePlayersList();
            drawBoard();
            showTradeResultModal(toIdx, 'accepted');
        }
        
        function rejectTradeOffer(toIdx) {
            const offer = pendingTradeOffers[toIdx];
            addLog(`${players[toIdx].name} lehnt Handelsangebot ab`, 'trade');
            delete pendingTradeOffers[toIdx];
            showTradeResultModal(toIdx, 'rejected');
        }
        
        function showTradeResultModal(toIdx, result) {
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('actionModalContent');
            const fromPlayer = players[currentPlayer]; // Der Spieler der das Angebot gemacht hat
            const toPlayer = players[toIdx];
            
            let html = '';
            if (result === 'accepted') {
                html = `
                    <div class="action-modal-title" style="color: #28a745;">✅ Handel akzeptiert!</div>
                    <div class="action-modal-subtitle">${toPlayer.name} hat zugestimmt</div>
                    <div style="background: #d4edda; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: center;">
                        <div style="font-size: 14px; color: #155724;">Der Handel wurde erfolgreich durchgeführt!</div>
                    </div>
                `;
            } else {
                html = `
                    <div class="action-modal-title" style="color: #dc3545;">❌ Handel abgelehnt</div>
                    <div class="action-modal-subtitle">${toPlayer.name} hat abgelehnt</div>
                    <div style="background: #f8d7da; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: center;">
                        <div style="font-size: 14px; color: #721c24;">Das Angebot wurde nicht akzeptiert</div>
                    </div>
                `;
            }
            
            html += `
                <div class="action-buttons">
                    <button class="action-btn pass" onclick="closeActionModal()">
                        👉 Weiter zu deinem Zug
                    </button>
                </div>
            `;
            
            content.innerHTML = html;
            modal.style.display = 'block';
        }
        function makeCounterOffer(toIdx) {
            alert('Gegenangebot-Funktionalität kommt bald! Für jetzt: Ablehnen und selbst ein Angebot machen.');
        }
    </script>
</body>
</html>
